<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,500;0,700;0,900;1,900&display=swap');
html,body{margin:0;width:1024px;height:1024px;background:#000;overflow:hidden;font-family:Inter,sans-serif}
.wrap{position:relative;width:1024px;height:1024px;background:radial-gradient(ellipse 70% 45% at 50% 62%,#1b2433 0%,#07090d 60%,#000 100%)}
h1{position:absolute;top:92px;width:100%;text-align:center;margin:0;font-size:178px;font-weight:900;font-style:italic;letter-spacing:-6px;line-height:1;color:#fff}
h1 span{padding-right:18px;background:linear-gradient(180deg,#FFC14D 0%,#FD9A00 55%,#E06A00 100%);-webkit-background-clip:text;color:transparent}
.by{position:absolute;top:300px;width:100%;display:flex;align-items:center;justify-content:center;gap:22px;color:#e8ecf3;font-size:40px;font-weight:700;letter-spacing:1px}
.by i{display:block;width:120px;height:3px;background:#e8ecf3;opacity:.85}
.by img{width:48px;height:48px}
.unit{position:absolute;left:87px;top:420px;width:850px}
.unit img{display:block;width:850px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.9)) drop-shadow(0 0 40px rgba(44,127,255,.12))}
.unit img.ref{transform:scaleY(-1);margin-top:6px;opacity:.22;-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent 35%);filter:none}
.sub{position:absolute;bottom:58px;width:100%;text-align:center;color:#8f9bb3;font-size:30px;font-weight:700;letter-spacing:8px}
.sub b{color:#2C7FFF}
</style></head><body><div class="wrap">
<h1>ATEK<span>303</span></h1>
<div class="by"><i></i><img src="logo.png">by Animatek<i></i></div>
<div class="unit"><img src="fm1/unit.png"><img class="ref" src="fm1/unit.png"></div>
<div class="sub">FIRMWARE FOR <b>M-VAVE FM-1</b></div>
</div>

</body></html>
